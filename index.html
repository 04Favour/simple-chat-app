<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestJS Pro Chat</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #messages-container::-webkit-scrollbar { width: 6px; }
        #messages-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .hidden-input { max-height: 0; opacity: 0; padding: 0; margin: 0; overflow: hidden; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[600px]">
        <div class="bg-indigo-600 p-4 text-white flex justify-between items-center">
            <h1 class="font-bold text-lg">NestJS Chat</h1>
            <span id="status" class="text-xs bg-indigo-500 px-2 py-1 rounded transition-colors">Connecting...</span>
        </div>

        <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50"></div>

        <div id="typing-indicator" class="px-4 py-1 text-xs text-slate-400 italic h-4"></div>

        <div class="p-4 bg-white border-t">
            <div class="flex flex-col gap-2">
                <input id="nameInput" type="text" placeholder="Your Name" 
                    class="border rounded-lg px-3 py-1 text-sm focus:outline-indigo-500 transition-all duration-300">
                
                <div class="flex gap-2">
                    <input id="messageInput" type="text" placeholder="Type a message..." 
                        class="flex-1 border rounded-lg px-3 py-2 focus:outline-indigo-500">
                    <button id="sendBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                        Send
                    </button>
                </div>
            </div>
        </div>
    </div>

<script 
  async
  src="http://localhost:3000/tracker.js" 
  data-ackee-server="http://localhost:3000" 
  data-ackee-domain-id="07e0644b-190f-4031-8121-25dbeb187e3b" 
  data-ackee-opts='{ "ignoreLocalhost": false, "ignoreOwnVisits": false }'>
</script>

<script>
        // --- CONFIGURATION ---
        const CREATE_MESSAGE = 'createMessage'; 
        const TYPING = 'typing';
        let isNameLocked = false;
        let typingTimeout;
        
        const socket = io('http://localhost:3001'); 

        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('messageInput');
        const nameInput = document.getElementById('nameInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typing-indicator');
        const statusBadge = document.getElementById('status');

        // --- SOCKET EVENTS ---

        socket.on('connect', () => {
            statusBadge.innerText = 'Online';
            statusBadge.classList.replace('bg-indigo-500', 'bg-green-500');
        });

        socket.on('disconnect', () => {
            statusBadge.innerText = 'Offline';
            statusBadge.classList.replace('bg-green-500', 'bg-red-500');
        });

        socket.on('new_user', (data) => {
            appendSystemMessage(data.message, 'text-slate-400');
        });

        socket.on('left_chat', (data) => {
            appendSystemMessage(data.message, 'text-red-500'); 
        });

        socket.on('message', (data) => {
            // const currentUserName = nameInput.value.trim()
            // // Display message only if it's from someone else
            // if (data.name !== currentUserName) {
            //     appendMessage(data.name, data.text, false);
            // }
            appendMessage(data.name, data.text, false)
        });

        // Listen for typing from others
        socket.on('typing', (data) => {
            if (data.isTyping) {
                typingIndicator.innerText = `${data.name} is typing...`;
            } else {
                typingIndicator.innerText = '';
            }
        });

        // --- ACTIONS ---

        const sendMessage = () => {
            const text = messageInput.value.trim();
            const name = nameInput.value.trim() || 'Anonymous';

            if (text) {
                // Lock the name after the first message
                if (!isNameLocked) {
                    nameInput.classList.add('hidden-input');
                    isNameLocked = true;
                }

                socket.emit(CREATE_MESSAGE, { name, text });
                appendMessage('You', text, true);
                
                messageInput.value = '';
                socket.emit(TYPING, { isTyping: false, name });
            }
        };

        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Typing logic - fixed to send name correctly
        messageInput.addEventListener('input', () => {
            const name = nameInput.value.trim() || 'Someone';
            
            socket.emit(TYPING, { isTyping: true, name });
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit(TYPING, { isTyping: false, name });
            }, 1500);
        });

        // --- UI HELPERS ---

        function appendMessage(user, text, isMe) {
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
            div.innerHTML = `
                <span class="text-[10px] text-slate-500 px-1 capitalize">${user}</span>
                <div class="${isMe ? 'bg-indigo-600 text-white' : 'bg-white border text-slate-800'} 
                            px-3 py-2 rounded-2xl max-w-[80%] shadow-sm text-sm">
                    ${text}
                </div>
            `;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function appendSystemMessage(text, colorClass = 'text-slate-400') {
            const div = document.createElement('div');
            div.className = `text-center text-[10px] my-2 uppercase tracking-widest font-semibold ${colorClass}`;
            div.innerText = text;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
</html>
